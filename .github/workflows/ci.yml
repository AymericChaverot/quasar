name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      # Runs go vet among the rest; .golangci.yml is the single description of
      # what counts as a problem, shared with whatever editor the author uses.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
      - name: Test
        run: go test ./...
      - name: Docker build
        run: docker build --build-arg VERSION=ci .

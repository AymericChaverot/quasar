# Traefik v3 static configuration. setup.sh replaces {{ACME_EMAIL}} at install.
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "tcp://socket-proxy:2375"
    exposedByDefault: false
    network: traefik-net

certificatesResolvers:
  letsencrypt:
    acme:
      email: "{{ACME_EMAIL}}"
      storage: /acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO

api:
  dashboard: false

{{define "sparks"}}
<div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
  {{range .}}
  <div class="card p-4">
    <div class="mb-2 flex items-baseline justify-between">
      <span class="muted text-sm">{{.Label}}</span>
      {{if not .Empty}}<span class="mono text-sm">{{.Latest}}</span>{{end}}
    </div>
    {{if .Empty}}
    <p class="faint text-xs">Not enough samples yet — data appears within a few minutes.</p>
    {{else}}
    <svg viewBox="0 0 240 48" class="h-12 w-full" preserveAspectRatio="none" role="img" aria-label="{{.Label}}: {{.Latest}}">
      <polygon points="{{.Area}}" fill="var(--chart)" fill-opacity="0.12"/>
      <polyline points="{{.Points}}" fill="none" stroke="var(--chart)" stroke-width="2"
                stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      {{range .Dots}}<circle cx="{{.X}}" cy="{{.Y}}" r="5" fill="transparent"><title>{{.Title}}</title></circle>{{end}}
    </svg>
    {{end}}
  </div>
  {{end}}
</div>
{{end}}

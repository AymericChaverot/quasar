{{define "layout"}}
<!DOCTYPE html>
<html lang="en" class="h-full" data-theme="{{.Theme}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Quasar</title>
  <link rel="icon" href="/static/favicon.svg">
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/sse.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/themes.css">
</head>
<body class="h-full antialiased">
  {{if not .HideNav}}
  <header class="site-header">
    <div class="mx-auto flex h-14 max-w-6xl items-center justify-between px-6">
      <div class="flex items-center gap-8">
        <a href="/" class="brand">Quasar</a>
        <span class="mono faint text-xs">{{.Version}}</span>
        <nav class="flex items-center gap-6">
          <a href="/" class="nav-link">Dashboard</a>
          <a href="/apps/new" class="nav-link">New application</a>
          <a href="/logs" class="nav-link">Logs</a>
          <a href="/system" class="nav-link">System</a>
          <a href="/settings" class="nav-link">Settings</a>
        </nav>
      </div>
      <form method="post" action="/logout">
        <button class="nav-link">Sign out</button>
      </form>
    </div>
  </header>
  {{end}}
  <main class="mx-auto max-w-6xl px-6 py-8">
    {{template "content" .}}
  </main>
</body>
</html>
{{end}}

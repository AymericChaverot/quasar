{{define "content"}}
<div class="mb-8 flex items-center justify-between">
  <h1 class="text-lg font-semibold">Dashboard</h1>
  <a href="/apps/new" class="btn-primary inline-block">New application</a>
</div>

<section class="mb-10">
  <h2 class="h-label mb-3">Server health</h2>
  <div hx-get="/partials/system" hx-trigger="load, every 5s" hx-swap="innerHTML">
    <div class="grid grid-cols-3 gap-4">
      <div class="card h-24 animate-pulse"></div>
      <div class="card h-24 animate-pulse"></div>
      <div class="card h-24 animate-pulse"></div>
    </div>
  </div>
</section>

<section class="mb-10">
  <h2 class="h-label mb-3">History</h2>
  <div hx-get="/partials/metrics" hx-trigger="load, every 60s" hx-swap="innerHTML">
    <div class="grid grid-cols-2 gap-4">
      <div class="card h-24 animate-pulse"></div>
      <div class="card h-24 animate-pulse"></div>
    </div>
  </div>
</section>

<section>
  <h2 class="h-label mb-3">Applications</h2>
  <div hx-get="/partials/apps" hx-trigger="load, every 5s" hx-swap="innerHTML">
    <div class="card h-24 animate-pulse"></div>
  </div>
</section>
{{end}}

{{define "content"}}
<div class="mb-8 flex items-center justify-between">
  <h1 class="page-title">Dashboard</h1>
  <a href="/apps/new" class="btn-primary">{{template "icon_plus"}}New application</a>
</div>

<section class="mb-10">
  <h2 class="h-label mb-3">Server health</h2>
  <div hx-get="/partials/system" hx-trigger="load, every 5s" hx-swap="innerHTML">
    <div class="grid grid-cols-3 gap-4">
      <div class="card h-24 animate-pulse"></div>
      <div class="card h-24 animate-pulse"></div>
      <div class="card h-24 animate-pulse"></div>
    </div>
  </div>
</section>

<section class="mb-10">
  <h2 class="h-label mb-3">History</h2>
  <div hx-get="/partials/metrics" hx-trigger="load, every 60s" hx-swap="innerHTML">
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <div class="card h-48 animate-pulse"></div>
      <div class="card h-48 animate-pulse"></div>
    </div>
  </div>
</section>

<section class="mb-10">
  <h2 class="h-label mb-3">Applications</h2>
  <div id="apps-pane" hx-get="/partials/apps" hx-trigger="load, every 5s" hx-swap="innerHTML">
    <div class="card h-24 animate-pulse"></div>
  </div>
</section>

<section>
  <h2 class="h-label mb-3">System containers</h2>
  <div hx-get="/partials/system-containers" hx-trigger="load, every 10s" hx-swap="innerHTML">
    <div class="grid grid-cols-3 gap-3">
      <div class="empty h-20 animate-pulse"></div>
      <div class="empty h-20 animate-pulse"></div>
      <div class="empty h-20 animate-pulse"></div>
    </div>
  </div>
</section>
{{end}}

{{define "content"}}
{{/* Laid out like Logs, which it is the other half of: what the applications
     said, and what was done to them. */}}
<div class="mb-8">
  <h1 class="page-title">Audit</h1>
  <p class="help mt-2!">Who did what, and from where. Append-only.</p>
</div>

<form method="get" action="/audit" class="mb-6 flex flex-wrap items-end field-row gap-4"
      hx-get="/partials/audit" hx-target="#audit-results" hx-swap="innerHTML">
  <div class="min-w-64 flex-1">
    <label for="q" class="label mb-1!">Search</label>
    <input id="q" name="q" type="text" value="{{.Query}}" placeholder="user, action or target" class="input mono">
  </div>
  <button type="submit" class="btn-primary">Search</button>
  <span id="audit-clear">{{if .Query}}<a href="/audit" class="btn">Clear</a>{{end}}</span>
</form>

<div id="audit-results">
  {{template "audit_results" .}}
</div>
{{end}}

{{define "content"}}
{{with .App}}
<a href="/apps/{{.ID}}" class="back-link">{{.Name}}</a>
<div class="mt-2 mb-6">
  <h1 class="page-title">{{.Name}} — terminal</h1>
  <p class="muted text-sm">Interactive /bin/sh inside the container. Session ends when you leave the page.</p>
</div>

<link rel="stylesheet" href="/static/vendor/xterm-6.0.0.css">
<div id="terminal" class="card overflow-hidden p-1" style="background: var(--log-bg)" data-app-id="{{.ID}}"></div>

<script src="/static/vendor/xterm-6.0.0.js"></script>
<script src="/static/vendor/xterm-addon-fit-0.11.0.js"></script>
<script src="/static/js/terminal.js" defer></script>
{{end}}
{{end}}

{{define "content"}}
{{with .App}}
<a href="/apps/{{.ID}}" class="back-link">{{.Name}}</a>
<div class="mt-2 mb-6">
  <h1 class="page-title">{{.Name}} — terminal</h1>
  <p class="muted text-sm">Interactive /bin/sh inside the container. Session ends when you leave the page.</p>
</div>

<link rel="stylesheet" href="https://unpkg.com/@xterm/xterm@6.0.0/css/xterm.css">
<div id="terminal" class="card overflow-hidden p-1" style="background: var(--log-bg)"></div>

<script src="https://unpkg.com/@xterm/xterm@6.0.0/lib/xterm.js"></script>
<script src="https://unpkg.com/@xterm/addon-fit@0.11.0/lib/addon-fit.js"></script>
<script>
  const term = new Terminal({
    fontFamily: 'ui-monospace, "Cascadia Code", Menlo, monospace',
    fontSize: 13,
    theme: { background: getComputedStyle(document.documentElement).getPropertyValue('--log-bg').trim() || '#000' },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById('terminal'));
  fit.fit();

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/apps/{{.ID}}/terminal/ws`);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    ws.send(JSON.stringify({ t: 'r', cols: term.cols, rows: term.rows }));
    term.focus();
  };
  ws.onmessage = (ev) => term.write(new Uint8Array(ev.data));
  ws.onclose = () => term.write('\r\n\x1b[2m[session closed]\x1b[0m\r\n');

  term.onData((data) => ws.send(JSON.stringify({ t: 'i', d: data })));
  term.onResize(({ cols, rows }) => ws.send(JSON.stringify({ t: 'r', cols, rows })));
  addEventListener('resize', () => fit.fit());
</script>
{{end}}
{{end}}

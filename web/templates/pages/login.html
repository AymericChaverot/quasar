{{define "content"}}
<div class="auth">
  <div class="auth-mark">{{template "logo_mark"}}</div>
  <h1 class="auth-brand">Quasar</h1>
  <p class="auth-sub">Admin dashboard</p>
  {{if .Error}}
  <div class="alert-err mt-6">{{.Error}}</div>
  {{end}}
  <form method="post" action="/login" class="card auth-card space-y-4">
    <div>
      <label for="username" class="label">Username</label>
      <input id="username" name="username" type="text" required autofocus class="input">
    </div>
    <div>
      <label for="password" class="label">Password</label>
      <input id="password" name="password" type="password" required class="input">
    </div>
    <button type="submit" class="btn-primary w-full justify-center py-2">Sign in</button>
  </form>
</div>
{{end}}

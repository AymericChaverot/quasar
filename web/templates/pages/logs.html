{{define "content"}}
<h1 class="page-title mb-8">Logs</h1>

<form class="mb-6 flex flex-wrap items-end field-row gap-4" hx-get="/partials/logs" hx-target="#log-results" hx-swap="innerHTML">
  <div>
    <label for="app" class="label mb-1!">Application</label>
    <select id="app" name="app" class="input">
      <option value="">All applications</option>
      {{range .Apps}}
      {{/* A select option holds text and nothing else, so the colour comes as a
           dot character, and the option is drawn in it. */}}
      <option value="{{.ID}}" style="color: {{.LogColor}}" {{if eq $.App .ID}}selected{{end}}>● {{.Name}}</option>
      {{end}}
    </select>
  </div>
  <div class="min-w-64 flex-1">
    <label for="q" class="label mb-1!">Search</label>
    <input id="q" name="q" type="text" value="{{.Query}}" placeholder="error, exception, ..." class="input mono">
  </div>
  <button type="submit" class="btn-primary">Search</button>
  {{template "log_toggles"}}
</form>

<div id="log-results" hx-get="/partials/logs?app={{.App | urlquery}}&q={{.Query | urlquery}}&page={{.Page}}" hx-trigger="load" hx-swap="innerHTML">
  <div class="card h-20 animate-pulse"></div>
</div>
{{end}}

<!-- The same mark the header carries, at tab size: a ring with a jet off each
     pole. Colours are literal here rather than themed — a favicon is drawn
     before any stylesheet, so it always shows the default theme's accent. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#08080a"/>
  <circle cx="16" cy="16" r="6" fill="none" stroke="#e8e9ec" stroke-width="2"/>
  <line x1="16" y1="2" x2="16" y2="8" stroke="#d4e815" stroke-width="2"/>
  <line x1="16" y1="24" x2="16" y2="30" stroke="#d4e815" stroke-width="2"/>
</svg>
